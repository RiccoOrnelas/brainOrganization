name: Programação Diária Telegram

on:
  schedule:
    - cron: '0 8 * * *'   # todo dia às 07:00 horário de Brasília (UTC-3 = 10:00 UTC)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Enviar mensagem no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python whatsapp_daily.py
